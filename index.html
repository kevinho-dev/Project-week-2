<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <title>Doosjes</title>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: #f5f6f8;
      padding: 40px;
    }

    .cards {
      display: flex;
      gap: 32px;
      justify-content: center;
    }

    .card {
      background: #fff;
      width: 260px;
      padding: 32px 24px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.12);
    }

    .icon-wrapper {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
    }

    .blue { background: #e6f0ff; color: #1f5bff; }
    .green { background: #e7fff0; color: #0aa83f; }
    .purple { background: #f3eaff; color: #8a2cff; }

    h3 {
      font-size: 28px;
      margin-bottom: 12px;
      color: #0f172a;
    }

    p {
      font-size: 16px;
      color: #475569;
      line-height: 1.4;
    }

    svg {
      width: 64px;
      height: 64px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
  </style>
</head>
<body>

<div class="cards">
  <div class="card">
    <div class="icon-wrapper blue">
      <!-- Kinderen -->
      <svg viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="9"/>
        <circle cx="9" cy="11" r="1"/>
        <circle cx="15" cy="11" r="1"/>
        <path d="M9 15c1.5 1 4.5 1 6 0"/>
        <path d="M6 9c1-2 3-3 6-3"/>
      </svg>
    </div>
    <h3>Kinderen</h3>
    <p>Avonturen en verhalen<br>voor jonge lezers</p>
  </div>

  <div class="card">
    <div class="icon-wrapper green">
      <!-- Volwassenen -->
      <svg viewBox="0 0 24 24">
        <circle cx="12" cy="8" r="4"/>
        <path d="M5 20c0-4 14-4 14 0"/>
      </svg>
    </div>
    <h3>Volwassenen</h3>
    <p>Ontdek boeiende literatuur en spanning</p>
  </div>

  <div class="card">
    <div class="icon-wrapper purple">
      <!-- Ouderen -->
      <svg viewBox="0 0 24 24">
        <circle cx="9" cy="8" r="4"/>
        <path d="M2 20c0-4 10-4 10 0"/>
        <path d="M15 6c2 1 3 3 3 5"/>
      </svg>
    </div>
    <h3>Ouderen</h3>
    <p>Herkenbare verhalen en klassiekers</p>
  </div>
</div>

</body>
</html>
